name: Hushaboom
options:
  bundleIdPrefix: io.burns
  deploymentTarget:
    iOS: "15.0"
    macOS: "12.0"
  createIntermediateGroups: true

packages:
  NoiseKit:
    path: NoiseKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 45T95LQM6S
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Hushaboom-iOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info-*.plist"
          - "*.entitlements"
      - path: Hushaboom.icon
        type: file
    dependencies:
      - package: NoiseKit
    settings:
      base:
        PRODUCT_NAME: Hushaboom
        PRODUCT_BUNDLE_IDENTIFIER: io.burns.hushaboom
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: Hushaboom
    info:
      path: App/Info-iOS.plist
      properties:
        CFBundleDisplayName: Hushaboom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    scheme:
      testPlans:
        - path: TestPlans/Hushaboom.xctestplan
          defaultPlan: true
        - path: TestPlans/Screenshots.xctestplan

  Hushaboom-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Hushaboom-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.burns.hushaboom.uitests
        TEST_TARGET_NAME: Hushaboom-iOS
        GENERATE_INFOPLIST_FILE: YES

  Hushaboom-macOSUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests-macOS
      - path: UITests/ScreenshotFixtures.swift
        type: file
    dependencies:
      - target: Hushaboom-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.burns.hushaboom.macuitests
        TEST_TARGET_NAME: Hushaboom-macOS
        GENERATE_INFOPLIST_FILE: YES

  Hushaboom-macOS:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info-*.plist"
          - "*.entitlements"
      - path: Hushaboom.icon
        type: file
    dependencies:
      - package: NoiseKit
    settings:
      base:
        PRODUCT_NAME: Hushaboom
        PRODUCT_BUNDLE_IDENTIFIER: io.burns.hushaboom
        ASSETCATALOG_COMPILER_APPICON_NAME: Hushaboom
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: App/Hushaboom-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: App/Info-macOS.plist
      properties:
        CFBundleDisplayName: Hushaboom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSHumanReadableCopyright: Copyright © 2026 Burns Software LLC. All rights reserved.
    scheme:
      testPlans:
        - path: TestPlans/Hushaboom-macOS.xctestplan
          defaultPlan: true
        - path: TestPlans/Screenshots-macOS.xctestplan
